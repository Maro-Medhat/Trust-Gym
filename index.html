
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Gym – فرع العقاد</title>
  <meta name="description" content="Trust Gym فرع العقاد – تابعنا، ادفع اشتراكك، وقيّمنا على خرائط جوجل.">
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --red: #e8201f;
      --red-dark: #b81413;
      --black: #0b0b0b;
      --card: #161616;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #a8a8a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(232, 32, 31, 0.35), transparent 55%),
        var(--black);
    }

    .card { width: 100%; max-width: 440px; }

    /* Header */
    .header { text-align: center; margin-bottom: 28px; }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--red);
      box-shadow: 0 0 30px rgba(232, 32, 31, 0.45);
      background: #000;
      margin-bottom: 14px;
    }

    .logo-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 900;
      font-size: 32px;
      line-height: 1.1;
      color: #fff;
      background: var(--red);
    }

    h1 { font-size: 28px; letter-spacing: 1px; text-transform: uppercase; }
    .branch { color: var(--red); font-weight: 700; font-size: 18px; margin-top: 4px; }

    /* Sections */
    .section { margin-bottom: 26px; }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Instagram Icon Fix */
    .btn svg.instagram-icon {
      fill: none;
    }

    .btn svg.instagram-icon circle:last-child {
      fill: currentColor;
      stroke: none;
    }

    /* InstaPay Icon Fix */
    .btn svg.instapay-icon {
      fill: none;
      stroke: currentColor;
    }

    .btn:hover, .btn:focus-visible {
      transform: translateY(-2px);
      background: var(--red);
      border-color: var(--red);
      outline: none;
    }

    .btn-pay { border-color: var(--red); }

    /* Vodafone Cash box */
    .pay-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .pay-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .pay-label svg { width: 20px; height: 20px; }

    .pay-number {
      display: block;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 12px;
    }

    .copy-btn {
      background: var(--red);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 9px 22px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: var(--red-dark); }

    /* Rating box */
    .rate-box {
      text-align: center;
      background: linear-gradient(160deg, var(--red), var(--red-dark));
      border-radius: 16px;
      padding: 22px 18px 10px;
    }

    .stars { font-size: 30px; color: #ffd24a; letter-spacing: 4px; margin-bottom: 6px; }
    .rate-box p { font-weight: 600; margin-bottom: 14px; }
    .btn-rate { background: #fff; color: var(--red-dark); border-color: #fff; }
    .btn-rate:hover { background: #000; color: #fff; border-color: #000; }

    /* Footer */
    .footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

    </section>

    <!-- Payment Methods -->

    <footer class="footer">© Trust Gym – فرع العقاد</footer>
  </main>
</body>
</html>
